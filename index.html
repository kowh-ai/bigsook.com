<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to bigsook.com - Your trusted partner for quality service and solutions.">
    <meta name="keywords" content="bigsook.com, service, solutions, quality">
    <meta name="author" content="bigsook.com">
    <title>BigSook - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 90%;
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #667eea;
        }

        .tagline {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 40px;
        }

        .content {
            margin: 40px 0;
            font-size: 1em;
            line-height: 1.8;
            color: #555;
        }

        .contact-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 30px;
            margin: 30px 0;
        }

        .contact-label {
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-bottom: 10px;
        }

        .contact-link {
            font-size: 1.2em;
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }

        .contact-link:hover {
            text-decoration: underline;
            color: #764ba2;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #999;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>bigsook.com</h1>
        <p class="tagline">Your trusted partner for quality service and solutions</p>

        <div class="content">
            <p>Welcome to bigsook.com We're here to help you achieve your goals with innovative solutions and exceptional service.</p>
        </div>

        <div class="contact-section">
            <div class="contact-label">Get in Touch</div>
            <a href="mailto:brett@bigsook.com" class="contact-link">brett@bigsook.com</a>
        </div>

        <div class="footer">
            <p>&copy; 2026 bigsook.com All rights reserved.</p>
        </div>
    </div>
</body>
</html>
