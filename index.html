<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A little color, a little wonder. Get in touch with Big Sook.">
    <meta name="author" content="bigsook.com">
    <meta name="theme-color" content="#f6f2e8">
    <title>bigsook.com</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: #f6f2e8;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            color: #704080;
            font-family: 'Avenir Next', Avenir, 'Segoe UI', sans-serif;
        }

        .container {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            padding: clamp(24px, 4vw, 58px);
        }

        .backdrop,
        .shade {
            position: absolute;
            z-index: -1;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .backdrop {
            object-fit: cover;
            object-position: center;
        }

        .shade {
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(246, 242, 232, 0.76) 0%,
                rgba(246, 242, 232, 0.2) 24%,
                transparent 45%,
                rgba(246, 242, 232, 0.1) 62%,
                rgba(246, 242, 232, 0.78) 100%
            );
        }

        .topbar,
        .footer {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            text-shadow: 0 1px 12px rgba(246, 242, 232, 0.75);
        }

        .topbar {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: lowercase;
        }

        .wordmark {
            color: inherit;
            text-decoration: none;
        }

        .top-link {
            color: inherit;
            opacity: 0.78;
        }

        .hero {
            position: relative;
            z-index: 1;
            max-width: 34rem;
            margin-bottom: clamp(12px, 4vh, 44px);
            animation: arrive 700ms ease-out both;
        }

        h1 {
            max-width: 12ch;
            font-family: 'Bodoni 72', 'Didot', Georgia, serif;
            font-size: clamp(2.8rem, 7vw, 6rem);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: 0;
        }

        .tagline {
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: lowercase;
        }

        .tagline strong {
            color: inherit;
            font-size: 1.35em;
            font-weight: 900;
            letter-spacing: 0;
            text-decoration: underline;
            text-decoration-color: #d94d43;
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;
        }

        .footer {
            align-items: end;
            font-size: 1rem;
        }

        .footer-label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: lowercase;
            opacity: 0.72;
        }

        .contact-link {
            color: inherit;
            font-weight: 700;
            text-decoration-color: #d94d43;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        .copyright {
            text-align: right;
            opacity: 0.72;
        }

        a:focus-visible {
            outline: 3px solid #287a9b;
            outline-offset: 5px;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }

            .backdrop {
                object-position: 54% center;
            }

            .shade {
                background: linear-gradient(
                    180deg,
                    rgba(246, 242, 232, 0.8) 0%,
                    rgba(246, 242, 232, 0.28) 24%,
                    transparent 48%,
                    rgba(246, 242, 232, 0.32) 62%,
                    rgba(246, 242, 232, 0.88) 100%
                );
            }

            .hero {
                margin-bottom: 20px;
            }

            h1 {
                font-size: clamp(2.6rem, 12vw, 4.5rem);
            }

            .footer {
                align-items: start;
                flex-direction: column;
                gap: 18px;
            }

            .copyright {
                text-align: left;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <img class="backdrop" src="clown.jpeg" alt="" aria-hidden="true" fetchpriority="high">
        <div class="shade" aria-hidden="true"></div>
        <header class="topbar">
            <a class="wordmark" href="/">bigsook.com</a>
            <span class="top-link">In development</span>
        </header>

        <section class="hero" aria-labelledby="headline">
            <p class="tagline"><strong>bigsook.com</strong> is coming soon.</p>
        </section>

        <footer class="footer">
            <p>
                <span class="footer-label">Need to reach out?</span>
                <a class="contact-link" href="mailto:brett@bigsook.com">brett@bigsook.com</a>
            </p>
            <p class="copyright">&copy; 2026 <bigsook class="com"></bigsook></p>
        </footer>
    </main>
</body>
</html>
